<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #ffffff;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        .links-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .links-list li {
            margin-bottom: 20px;
            padding-left: 24px;
            position: relative;
        }

        .links-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #666;
        }

        .link {
            color: #2970ff;
            text-decoration: none;
            font-weight: 500;
        }

        .link:hover {
            text-decoration: underline;
        }

        .description {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
        }

        .generator {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .output {
            background: #f8f8f8;
            padding: 12px;
            border-radius: 4px;
            margin-top: 12px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 13px;
        }

        button {
            background: #2970ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 14px;
        }

        button:hover {
            background: #1a54d9;
        }

        h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <ul class="links-list">
        <li>
            <a href="https://github.com" class="link">GitHub</a>
            <div class="description">Code and repos</div>
        </li>
        <li>
            <a href="https://app.datadoghq.com" class="link">Datadog</a>
            <div class="description">Metrics and logs</div>
        </li>
        <li>
            <a href="https://coda.io" class="link">Coda</a>
            <div class="description">Team docs and workspaces</div>
        </li>
        <li>
            <a href="https://docs.google.com" class="link">Google Docs</a>
            <div class="description">Document editing</div>
        </li>
    </ul>

    <div class="generator">
        <h3>Add New Link</h3>
        <input type="text" id="linkName" placeholder="Link Name" oninput="updatePreview()" />
        <input type="text" id="linkUrl" placeholder="URL (include https://)" oninput="updatePreview()" />
        <input type="text" id="linkDescription" placeholder="Short Description" oninput="updatePreview()" />
        <div id="output" class="output"></div>
    </div>

    <script>
        function updatePreview() {
            const name = document.getElementById('linkName').value;
            const url = document.getElementById('linkUrl').value;
            const description = document.getElementById('linkDescription').value;
            
            if (name || url || description) {
                const html = `<li>\n    <a href="${url}" class="link">${name}</a>\n    <div class="description">${description}</div>\n</li>`;
                document.getElementById('output').textContent = html;
            } else {
                document.getElementById('output').textContent = '';
            }
        }
    </script>
</body>
</html>
